<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary English sha Khasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Mobile Ads SDK -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-3940256099942544" crossorigin="anonymous"></script>
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 80px; }
        /* Header & Nav */
        header { background: #2563eb; color: white; padding: 10px 10px; display: flex; align-items: center; gap: 60px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .brand-box { width: 40px; height: 40px; border-radius: 50%; background: #1d4ed8; overflow: hidden; }
        .brand-box img { width: 100%; height: 100%; object-fit: cover; }
        nav { background: #3b82f6; padding: 7px 20px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 15px; font-weight: 900; }
        nav a:hover { text-decoration: underline; }

        /* Main */
        main { max-width: 700px; margin: 15px auto; padding: 0 15px; }
        .search-box { background: white; padding: 15px; border-radius: 30px; border: 2px solid #e2e8f0; display: flex; gap: 7px; }
        input { flex: 1; padding: 8px; border: 2px solid #e2e8f0; border-radius: 15px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        button { background: #2563eb; color: white; padding: 5px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }

        /* UI Elements */
        .hidden { display: none !important; }
        .card { background: white; border: 2px solid #e2e8f0; padding: 10px; border-radius: 15px; margin-top: 15px; }
        .loader { text-align: center; margin: 20px 0; }
        
        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto 10px; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 60px; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
        .result-card{ position:relative; overflow:hidden; }

        /* Watermarks */
        .kba-watermark{ position:absolute; top:7px; right:10px; font-size:14px; font-weight:bold; color:rgba(37,99,235,0.25); pointer-events:none; }
        .word-watermark{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:60px; font-weight:bold; color:rgba(0,0,0,0.05); white-space:nowrap; pointer-events:none; user-select:none; }

        /* Banner Ad Container */
        .ad-container { text-align: center; margin: 20px 0; }
    </style>
</head>
<body>

<header>
    <div class="brand-box"><img src="CompanyLogo.png" alt="Logo"></div>
    <h1>Arklyn.Studio</h1>
    <button onclick="shareApp()" style="margin-left:auto; background:white; color:#2563eb; padding:8px 12px; border-radius:20px;">📤</button>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Privacy</a>
    <a href="#">Contact us</a>
</nav>

<main>
    <div style="text-align:center; margin-bottom: 15px; font-size: 22px">
        <h2>English sha Khasi Dictionary</h2>
    </div>

    <!-- Banner Ad Section (Fixed Size Banner Test ID) -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:inline-block;width:320px;height:50px"
             data-ad-client="ca-app-pub-3940256099942544"
             data-ad-slot="6300978111"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <div class="search-box">
        <input type="text" id="wordInput" placeholder="Enter a word..." oninput="hideResults()" onkeypress="if(event.key==='Enter')handleSearch()">
        <button onclick="handleSearch()">Search</button>
    </div>

    <div id="searchLoader" class="loader hidden">
        <div class="spinner"></div>
        <p>Searching...</p>
    </div>
    
    <!-- Result Card -->
    <div id="definitionBox" class="card hidden result-card">
        <div class="kba-watermark">KBA</div>
        <div id="wordWatermark" class="word-watermark">WORD</div>

        <h3>Result:</h3>
        <div id="htmlContentArea" style="margin-top:10px;"></div>

        <div style="margin-top:15px;border-top:1px solid #eee;padding-top:10px;">
            <p><strong>Example:</strong></p>
            <p id="exampleText" style="font-style:italic;color:#475569;"></p>
        </div>
    </div>
</main>

<div id="popupModal" class="modal hidden">
    <div class="modal-content">
        <h4 id="popupTitle">Notice:</h4>
        <p id="popupMessage" style="margin:10px 0;"></p>
        <div id="popupActions" style="text-align:right;"></div>
    </div>
</div>

<script>
  window.addEventListener("online", () => { console.log("Online"); });
  window.addEventListener("offline", () => { console.log("Offline"); });

  let searchCount = 0;
  let firstSearchRewardAsked = false;
  let pendingWord = "";

  const localDictionary = {
    "a": `<strong><b><u>Khasi word:</u></strong><br><br><em><p><i> Noun:</i></b></p><p>=> U; Ka; Uwei; Kawei; Shi.<br>U dak pule alphabet u ba nyngkong napdeng ki alphabet phareng.</em>`,
    "aardvark": `<strong><b><u>Khasi word:</u></strong><br><br><em><p><i> Noun:</i></b></p><p>=> U kynja mrad uba bam dkhiew.</em>`,
    "aback": `<strong><b><u>Khasi word:</u></strong><br><br><em><p><i> Adverb:</i></b></p><p>=> Kyndit; Kyndit kynsan; Shadien.</em>`,
  };

  const secondaryExampleDatabase = {
    "a": "I saw a bird layout tier node.",
    "c": "u dak ba lai na pdeng ki alphabet."
  };

  function shouldShowInterstitial(count) {
      return [5, 10, 20, 30, 40, 70].includes(count);
  }

  function shouldShowRewarded(count) {
      return [15, 30, 45, 60].includes(count);
  }

  const cardThemes = ["#dbeafe", "#dcfce7", "#fef3c7", "#fee2e2", "#ede9fe", "#fce7f3", "#cffafe", "#f3f4f6"];

  function hideResults() {
      document.getElementById('definitionBox').classList.add('hidden');
  }

  function handleSearch() {
      const word = document.getElementById('wordInput').value.trim().toLowerCase();

      if (!word) {
          alert("Sngewbha thoh ka kyntien.");
          return;
      }

      if (!firstSearchRewardAsked) {
          firstSearchRewardAsked = true;
          const wantReward = confirm("Watch a rewarded ad before your first search?");
          if (wantReward) {
              pendingWord = word;
              if (typeof Android !== "undefined") {
                  Android.showRewarded();
              } else {
                  console.log("Trigger Rewarded Ad: ca-app-pub-3940256099942544/5224354917");
                  onRewardEarned(); // Fallback for local browser testing
              }
              return;
          }
      }

      executeSearch(word);
  }

  function executeSearch(word) {
      searchCount++;

      if (shouldShowInterstitial(searchCount)) {
          if (typeof Android !== "undefined") {
              Android.showInterstitial();
          } else {
              console.log("Trigger Interstitial Ad: ca-app-pub-3940256099942544/1033173712");
          }
      }

      if (shouldShowRewarded(searchCount)) {
          pendingWord = word;
          if (typeof Android !== "undefined") {
              Android.showRewarded();
          } else {
              console.log("Trigger Rewarded Ad: ca-app-pub-3940256099942544/5224354917");
              onRewardEarned(); // Fallback for local browser testing
          }
          return;
      }

      continueSearch(word);
  }

  // This function is called by Android natively when reward is earned
  function onRewardEarned() {
      if (pendingWord) {
          continueSearch(pendingWord);
          pendingWord = "";
      }
  }

  function shareApp() {
      setTimeout(() => {
          const shareText = `📚 KB's Dictionary English sha Khasi\n\nDownload now:\nhttps://your-download-link.com\n\nLearn Khasi and English easily!`;
          if (navigator.share) {
              navigator.share({ title: "KB's Dictionary", text: shareText });
          } else {
              navigator.clipboard.writeText(shareText);
              alert("Share message copied to clipboard.");
          }
      }, 1000);
  }

  function continueSearch(word) {
      const loader = document.getElementById('searchLoader');
      const defBox = document.getElementById('definitionBox');

      loader.classList.remove('hidden');
      defBox.classList.add('hidden');

      setTimeout(() => {
          let definition = localDictionary[word] || "Khlem ïoh jingbatai.";
          let example = secondaryExampleDatabase[word] || "Khlem don Nongmuna.";

          loader.classList.add('hidden');
          document.getElementById('htmlContentArea').innerHTML = definition;
          document.getElementById('exampleText').innerText = example;

          const randomColor = cardThemes[Math.floor(Math.random() * cardThemes.length)];
          defBox.style.backgroundColor = randomColor;
          document.getElementById("wordWatermark").innerText = word.toUpperCase();
          defBox.classList.add('hidden'); // Fix toggle sequence
          defBox.classList.remove('hidden');
      }, 150);
  }
</script>

</body>
</html>
